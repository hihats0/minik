<!doctype html>
<!-- Minik sohbet sitesi: telefondan Minik'le konusur, 7 hormonu canli gosterir. Cagiran: Vercel yayini, API agiz/web_sohbet.py. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minik</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111418; color: #e8e8e8; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 12px; background: #1b2027; border-bottom: 1px solid #2b313a; }
  .ust { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .satir { display: grid; grid-template-columns: 88px 1fr 38px 40px; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
  .cubuk { height: 8px; background: #2b313a; border-radius: 4px; overflow: hidden; }
  .dolu { height: 100%; background: #5aa0e6; transition: width .6s; }
  .fark { font-size: 12px; opacity: 0; transition: opacity .4s; }
  .fark.goster { opacity: 1; }
  .arti { color: #6fd08c; } .eksi { color: #e67a6f; }
  .not { font-size: 11px; color: #8a93a0; margin-top: 4px; }
  main { flex: 1; overflow-y: auto; padding: 12px; }
  .balon { max-width: 85%; padding: 8px 12px; border-radius: 14px; margin: 6px 0; white-space: pre-wrap; line-height: 1.35; }
  .ben { background: #2f6fb0; margin-left: auto; }
  .minik { background: #262c35; }
  .hata { background: #5a2626; }
  .dusunuyor { color: #8a93a0; font-style: italic; }
  form { display: flex; gap: 8px; padding: 10px; background: #1b2027; border-top: 1px solid #2b313a; }
  input { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #2b313a; background: #111418; color: #e8e8e8; }
  button { font-size: 16px; padding: 10px 16px; border-radius: 10px; border: 0; background: #2f6fb0; color: #fff; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div class="ust"><span>Yas: <b id="yas">-</b></span><span>Kafa: <b id="kafa">-</b></span></div>
  <div id="hormonlar"></div>
  <div class="not">Ton cevaptan sonra islenir: hormonlar cevaptan birkac saniye sonra oynar.</div>
</header>
<main id="sohbet"></main>
<form id="form"><input id="giris" maxlength="500" placeholder="Minik'e yaz..." autocomplete="off"><button id="gonder">Gonder</button></form>
<script>
const API = "__API__";
const HORMONLAR = ["dopamin", "noradrenalin", "serotonin", "kortizol", "oksitosin", "melatonin", "merak"];
const YOKLAMA_MS = 4000;
const FARK_GOSTERME_MS = 3000;
const KAFA_METNI = { hazir: "hazir", yukleniyor: "yukleniyor", kapali: "kapali (ilk mesajda acilir)" };
let onceki = {};

function anahtarAl() {
  const m = location.hash.match(/anahtar=([^&]+)/);
  if (m) { localStorage.setItem("minik_anahtar", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
  let a = localStorage.getItem("minik_anahtar");
  if (!a) { a = prompt("Minik anahtari:") || ""; if (a) localStorage.setItem("minik_anahtar", a); }
  return a;
}
const ANAHTAR = anahtarAl();

function cubuklariKur() {
  const kutu = document.getElementById("hormonlar");
  for (const ad of HORMONLAR) {
    kutu.insertAdjacentHTML("beforeend", `<div class="satir"><span>${ad}</span><div class="cubuk"><div class="dolu" id="c-${ad}" style="width:0"></div></div><span id="s-${ad}">-</span><span class="fark" id="f-${ad}"></span></div>`);
  }
}

function hormonGoster(h) {
  for (const ad of HORMONLAR) {
    if (!(ad in h)) continue;
    const d = Math.max(0, Math.min(100, h[ad]));
    document.getElementById("c-" + ad).style.width = d + "%";
    document.getElementById("s-" + ad).textContent = Math.round(h[ad]);
    if (ad in onceki && Math.abs(h[ad] - onceki[ad]) >= 0.5) farkGoster(ad, h[ad] - onceki[ad]);
    onceki[ad] = h[ad];
  }
}

function farkGoster(ad, fark) {
  const f = document.getElementById("f-" + ad);
  f.textContent = (fark > 0 ? "+" : "") + fark.toFixed(1);
  f.className = "fark goster " + (fark > 0 ? "arti" : "eksi");
  setTimeout(() => f.classList.remove("goster"), FARK_GOSTERME_MS);
}

// Gemma cevapta markdown yaziyor, sayfa duz metin gosterir: isaretler silinir, yazi kalir (duygu-a).
function duzMetin(metin) {
  return metin
    .replace(/```[a-z]*\n?/gi, "")
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")
    .replace(/^\s*[-*+]\s+/gm, "")
    .replace(/(\*\*|__)(.+?)\1/g, "$2")
    .replace(/\*(\S.*?)\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1 ($2)");
}

function balon(metin, sinif) {
  const b = document.createElement("div");
  b.className = "balon " + sinif; b.textContent = metin;
  const s = document.getElementById("sohbet"); s.appendChild(b); s.scrollTop = s.scrollHeight;
  return b;
}

function hataMetni(kod) {
  if (kod === 401) return "Anahtar yanlis. Sayfayi dogru baglantiyla yeniden ac.";
  if (kod === 400) return "Mesaj bos olamaz, en cok 500 karakter.";
  if (kod === 504) return "Minik zamaninda cevap veremedi. Biraz sonra tekrar dene.";
  return "Minik'e ulasilamadi (bilgisayar kapali ya da baglanti yok).";
}

async function istek(yol, govde) {
  const ayar = { method: govde ? "POST" : "GET", headers: { "X-Anahtar": ANAHTAR } };
  if (govde) { ayar.headers["Content-Type"] = "application/json"; ayar.body = JSON.stringify(govde); }
  const y = await fetch(API + yol, ayar);
  if (!y.ok) throw y.status;
  return y.json();
}

async function durumYokla() {
  try {
    const d = await istek("/durum");
    hormonGoster(d.hormonlar);
    document.getElementById("yas").textContent = d.yas;
    document.getElementById("kafa").textContent = KAFA_METNI[d.kafa] || d.kafa;
  } catch (e) { document.getElementById("kafa").textContent = "ulasilamiyor"; }
}

document.getElementById("form").addEventListener("submit", async (olay) => {
  olay.preventDefault();
  const giris = document.getElementById("giris"), dugme = document.getElementById("gonder");
  const mesaj = giris.value.trim();
  if (!mesaj) return;
  balon(mesaj, "ben"); giris.value = ""; dugme.disabled = true;
  const bekle = balon("Minik dusunuyor... (10-40 sn, model yukleniyorsa daha uzun)", "minik dusunuyor");
  try {
    const d = await istek("/konus", { mesaj });
    bekle.remove(); balon(duzMetin(d.cevap), "minik"); hormonGoster(d.hormonlar);
  } catch (kod) { bekle.remove(); balon(hataMetni(kod), "hata"); }
  dugme.disabled = false; durumYokla();
});

cubuklariKur();
durumYokla();
setInterval(durumYokla, YOKLAMA_MS);
</script>
</body>
</html>
